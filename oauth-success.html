<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career-View | 로그인 처리 중</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#10B981',
                        brandHover: '#059669',
                        brandLight: '#D1FAE5'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

<div class="bg-white shadow-2xl rounded-2xl flex flex-col max-w-sm sm:max-w-md w-full overflow-hidden h-[85vh] sm:h-[90vh] items-center justify-center p-8">

    <div class="relative w-28 h-28 mb-8 flex justify-center items-center">
        <div class="absolute inset-0 border-4 border-brand/20 rounded-2xl animate-[pulse_2s_ease-in-out_infinite]"></div>
        <div class="absolute inset-2 border-2 border-brand/40 rounded-xl border-dashed animate-[spin_4s_linear_infinite]"></div>
        <div class="w-4 h-4 bg-brand rounded-full animate-ping absolute"></div>
        <div class="w-3 h-3 bg-brand rounded-full absolute"></div>
    </div>

    <div class="text-center">
        <h2 id="statusTitle" class="text-xl font-bold text-slate-800 mb-2">구글 로그인 완료 중</h2>
        <p id="statusDesc" class="text-slate-400 text-sm leading-relaxed">
            안전한 접속을 위해 인증 토큰을<br>확인하고 있습니다. 잠시만 기다려주세요.
        </p>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // 1. 주소창(URL)에서 구글이 던져준 임시 영수증 'code'를 추출합니다.
        // 예: http://localhost:63342/oauth-success.html?code=xxxxxx
        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get('code');

        // 테스트용 백엔드 주소 (나중에 팀원의 실제 서버 주소로 변경하세요. 예: 'http://localhost:8080')
        const BACKEND_BASE_URL = 'http://localhost:8080';

        if (authCode) {
            console.log("구글 인가 코드 획득 성공:", authCode);

            // 2. [실제 연동 시 적용할 fetch 코드]
            /*
            fetch(`${BACKEND_BASE_URL}/api/v1/auth/oauth/token`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    refreshToken: authCode // 팀원 명세서에 맞춰 code를 Body에 실어 보냅니다.
                })
            })
            .then(response => response.json())
            .then(res => {
                if (res.success && res.data) {
                    // 백엔드가 준 진짜 토큰 2개를 localStorage에 저장 (팀원 요청 사항)
                    localStorage.setItem('accessToken', res.data.accessToken);
                    localStorage.setItem('refreshToken', res.data.refreshToken);

                    // 로그인 성공 후 온보딩(직무 선택)으로 이동
                    window.location.href = 'job-select.html';
                } else {
                    handleError("인증 실패: 토큰을 발급받지 못했습니다.");
                }
            })
            .catch(err => {
                console.error("서버 통신 에러:", err);
                handleError("서버와의 통신 중 오류가 발생했습니다.");
            });
            */

            // 3. [임시 테스트용 Mock 로직]
            // 백엔드가 켜져 있지 않아도 화면 흐름을 테스트할 수 있도록 1.5초 후 자동으로 넘어가게 처리했습니다.
            setTimeout(() => {
                // 가짜 토큰 저장
                localStorage.setItem('accessToken', 'mock_google_access_token_abcde');
                localStorage.setItem('refreshToken', 'mock_google_refresh_token_fghij');

                // 최초 로그인이라 가정하고 직무 선택 화면으로 이동
                window.location.href = 'job-select.html';
            }, 1500);

        } else {
            // URL에 code가 없는 잘못된 접근일 경우
            handleError("올바르지 않은 접근입니다. 로그인 창으로 돌아갑니다.");
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }
    });

    // 에러 발생 시 화면 문구를 바꿔주는 함수
    function handleError(message) {
        document.getElementById('statusTitle').innerText = "로그인 오류";
        document.getElementById('statusTitle').classList.add('text-rose-500');
        document.getElementById('statusDesc').innerText = message;
    }
</script>
</body>
</html>
