<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career-View | 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#10B981',
                        brandHover: '#059669',
                        brandLight: '#D1FAE5'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

<div class="bg-white shadow-2xl rounded-2xl flex flex-col max-w-sm sm:max-w-md w-full overflow-hidden">

    <div class="w-full bg-brandLight/40 py-10 px-6 flex flex-col justify-center items-center text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-brand/10 to-transparent"></div>

        <div class="relative z-10">
            <h1 class="text-3xl font-extrabold text-slate-800 mb-1 tracking-tight">Career-View</h1>
            <p class="text-brand font-semibold text-sm mb-6">지능형 모의 면접 스마트 거울</p>

            <div class="relative w-28 h-28 mx-auto flex justify-center items-center">
                <div class="absolute inset-0 border-4 border-brand/30 rounded-2xl animate-[pulse_2s_ease-in-out_infinite]"></div>
                <div class="absolute inset-2 border-2 border-brand/50 rounded-xl border-dashed animate-[spin_15s_linear_infinite]"></div>
                <svg class="w-12 h-12 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8v-2a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 8v2a2 2 0 0 1-2 2h-2m-10 0h-2a2 2 0 0 1-2-2v-2"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 10a2 2 0 1 1 4 0 2 2 0 0 1-4 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 14c0-2-2-3-4-3s-4 1-4 3v1h8v-1z"></path>
                </svg>
            </div>
        </div>
    </div>

    <div class="w-full p-6 sm:p-8">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-slate-800 mb-1">환영합니다 👋</h2>
            <p class="text-slate-500 text-sm">성공적인 면접을 위한 첫 걸음을 시작하세요.</p>
        </div>

        <form id="loginForm">
            <div class="mb-4">
                <label for="email" class="block text-slate-700 text-xs font-bold mb-2">이메일</label>
                <input type="email" id="email" class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:border-brand focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand/20 transition-all duration-300 text-sm" placeholder="user@example.com" required>
            </div>

            <div class="mb-6">
                <label for="password" class="block text-slate-700 text-xs font-bold mb-2">비밀번호</label>
                <input type="password" id="password" class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:border-brand focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand/20 transition-all duration-300 text-sm" placeholder="••••••••" required>
                <div class="flex justify-end mt-2">
                    <a href="#" class="text-xs font-semibold text-brand hover:text-brandHover transition-colors">비밀번호를 잊으셨나요?</a>
                </div>
            </div>

            <button type="submit" class="w-full bg-brand hover:bg-brandHover text-white font-bold py-3.5 rounded-xl shadow-lg shadow-brand/30 hover:shadow-brand/50 transition-all duration-300 transform hover:-translate-y-0.5 text-sm">
                로그인
            </button>
        </form>

        <div class="mt-6 flex items-center justify-between">
            <span class="border-b w-1/4 border-slate-200"></span>
            <span class="text-[10px] text-center text-slate-400 font-medium uppercase tracking-widest">OR</span>
            <span class="border-b w-1/4 border-slate-200"></span>
        </div>

        <button class="w-full mt-5 py-2.5 border border-slate-200 rounded-xl text-slate-700 bg-white hover:bg-slate-50 font-bold flex items-center justify-center gap-2 transition-colors text-sm">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google 계정으로 계속하기
        </button>

        <p class="mt-8 text-center text-xs text-slate-600 font-medium">
            아직 계정이 없으신가요?
            <a href="signup.html" class="font-bold text-brand hover:text-brandHover hover:underline transition-all duration-300 ml-1.5">지금 바로 회원가입</a>
        </p>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        // 폼 제출 시 페이지 새로고침 방지
        event.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        console.log('로그인 시도:', email);

        if (email && password) {
            // 1. 백엔드 팀원의 명세에 맞춘 가짜(Mock) 데이터 생성
            const mockResponseData = {
                accessToken: "dummy_access_token_12345",
                refreshToken: "dummy_refresh_token_67890"
            };

            // 2. 브라우저의 LocalStorage에 팀원이 요청한 이름 그대로 토큰 2개 저장
            localStorage.setItem('accessToken', mockResponseData.accessToken);
            localStorage.setItem('refreshToken', mockResponseData.refreshToken);
            console.log("토큰이 브라우저에 안전하게 저장되었습니다.");

            // 3. 최초 로그인 여부 분기 처리 (임시)
            // true면 직무 선택 화면으로, false면 기존 유저이므로 메인 홈으로 갑니다.
            const isFirstLogin = true;

            // 팝업 없이 부드럽게 화면 이동
            if (isFirstLogin) {
                window.location.href = 'job-select.html';
            } else {
                window.location.href = 'home.html';
            }
        } else {
            alert('이메일과 비밀번호를 입력해주세요.');
        }
    });
</script>
</body>
</html>
